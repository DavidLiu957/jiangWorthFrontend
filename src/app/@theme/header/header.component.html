<div class="header-container">
    <div class="logo-container">
        <a (click)="toggleSidebar()" href="#" class="sidebar-toggle" [class.active]="isActive">
            <nb-icon icon="menu-outline"></nb-icon>
        </a>
        <a class="logo" href="#" (click)="navigateHome()"><span>{{ header.title }}</span></a>
    </div>
</div>

<div class="header-container">
    <a href="/kbn" target="_blank">
        <img src="assets/images/kbn.png" style="max-width: 100px; max-height: 30px;" />
    </a>
    <nb-actions size="small">
        @if (user) {
            <nb-action class="user-action">
                <nb-user [nbContextMenu]="userMenu" nbContextMenuTag="user-menu" size="medium" shape="round"
                    [onlyPicture]="userPictureOnly" [name]="user.fullName" [picture]="user.picture">
                </nb-user>
            </nb-action>
        }
    </nb-actions>
</div>
